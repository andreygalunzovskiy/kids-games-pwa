<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Займи малыша · 5 минут</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
</head>
<body class="bg-gradient-to-br from-orange-50 via-amber-50 to-yellow-50 min-h-screen">

<div class="max-w-xl mx-auto p-6 pt-12">
    <div class="text-center mb-10">
        <div class="text-6xl mb-3">🧸</div>
        <h1 class="text-4xl font-bold text-orange-600">Займи малыша</h1>
        <p class="text-orange-500 mt-1 text-lg">5 минут · подручные вещи · без экранов</p>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-8">
        <form id="game-form" class="space-y-8">
            <!-- Возраст -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-3">Сколько лет ребёнку?</label>
                <div class="grid grid-cols-4 gap-3">
                    <button type="button" data-age="1-2" class="age-btn py-4 bg-orange-100 hover:bg-orange-200 rounded-2xl text-2xl transition">🐣 1–2</button>
                    <button type="button" data-age="3-4" class="age-btn py-4 bg-orange-100 hover:bg-orange-200 rounded-2xl text-2xl transition">🧸 3–4</button>
                    <button type="button" data-age="5-6" class="age-btn py-4 bg-orange-100 hover:bg-orange-200 rounded-2xl text-2xl transition">🚀 5–6</button>
                    <button type="button" data-age="7+" class="age-btn py-4 bg-orange-100 hover:bg-orange-200 rounded-2xl text-2xl transition">🌟 7+</button>
                </div>
            </div>

            <!-- Предметы -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-3">Что есть под рукой?</label>
                <div id="items-grid" class="grid grid-cols-2 gap-3"></div>
            </div>

            <!-- Время (ВАЖНО: data-time БЕЗ «мин») -->
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-3">Сколько времени есть?</label>
                <div class="flex gap-3">
                    <button type="button" data-time="3-5" class="time-btn flex-1 py-4 bg-amber-100 hover:bg-amber-200 rounded-2xl transition">3–5 мин</button>
                    <button type="button" data-time="10" class="time-btn flex-1 py-4 bg-amber-100 hover:bg-amber-200 rounded-2xl transition">10 мин</button>
                    <button type="button" data-time="20+" class="time-btn flex-1 py-4 bg-amber-100 hover:bg-amber-200 rounded-2xl transition">20+ мин</button>
                </div>
            </div>

            <button type="submit" class="w-full py-6 bg-gradient-to-r from-orange-500 to-amber-500 text-white text-2xl font-bold rounded-3xl shadow-lg hover:scale-105 transition">
                Дай игру! 🎲
            </button>
        </form>
    </div>

    <div id="result" class="hidden mt-10">
        <div class="bg-white rounded-3xl shadow-xl p-8">
            <h2 id="name" class="text-3xl font-bold text-orange-600"></h2>
            <p class="text-gray-500 mt-1">🧠 <span id="goal"></span></p>
            <p class="text-2xl font-bold text-amber-600 mt-4" id="time-badge"></p>
            <pre id="description" class="mt-6 text-lg whitespace-pre-wrap"></pre>
            <div class="flex gap-4 mt-8">
                <button id="another" class="flex-1 py-4 bg-gray-100 rounded-2xl">Ещё одну</button>
                <button onclick="location.reload()" class="flex-1 py-4 bg-green-100 text-green-700 rounded-2xl">Поделиться</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
